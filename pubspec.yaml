name: tailor
description: An offline tailoring shop management application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  drift: ^2.24.0
  drift_flutter: ^0.3.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  pdf: ^3.13.1
  printing: ^5.14.2
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  archive: ^4.4.0
  crypto: ^3.0.7
  sqlite3: ^3.5.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Medium.ttf
